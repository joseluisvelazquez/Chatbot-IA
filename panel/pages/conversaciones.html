
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversaciones</title>


</head>

<body>
<audio id="notificationSound" src="../sounds/notification.mp3"></audio>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar" id="conversationList"></div>

    <!-- CHAT -->
    <div class="chat">

        <div class="chat-header" id="chatHeader">
            Bienvenido a tu chat, selecciona una conversación o inicia una nueva. :D
        </div>

        <!-- MENSAJES -->
        <div id="messages"></div>

        <!-- INPUT -->
        <div class="input">
            <input 
                id="messageInput" 
                placeholder="Escribe un mensaje..." 
                oninput="handleTyping()" 
                onkeydown="handleKeyDown(event)"
            />
            
            <button onclick="send()">Enviar</button>
        </div>

    </div>

</div>



</body>
</html>
