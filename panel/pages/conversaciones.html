<div id="chatShell" class="flex h-full w-full overflow-hidden">

    <!-- SIDEBAR -->
    <div id="conversationPane" class="w-80 shrink-0 flex flex-col
        bg-white dark:bg-slate-800
        border-r border-gray-200 dark:border-slate-700"
    >

        <!-- BUSCADOR -->
        <div class="p-3">
            <input
                id="searchInput"
                placeholder="Buscar chat..."
                class="w-full px-3 py-2 rounded-lg
                       bg-gray-100 dark:bg-slate-700
                       text-black dark:text-white
                       text-sm outline-none
                       placeholder-gray-400"
            />
        </div>

        <!-- FILTROS -->
        <div class="px-3 pb-2 flex gap-2 overflow-x-auto">

            <button id="filterAll"
                class="filter-btn shrink-0 px-3 py-1 text-xs rounded-lg transition
                    bg-green-600 text-white
                    dark:bg-green-500 dark:text-white">
                Todos
            </button>

            <button id="filterUnread"
                class="filter-btn shrink-0 px-3 py-1 text-xs rounded-lg transition
                    bg-gray-200 text-gray-700
                    dark:bg-slate-700 dark:text-gray-300">
                No leidos
            </button>

        </div>

        <!-- LISTA -->
        <div
            id="conversationList"
            class="flex-1 overflow-y-auto"
        ></div>
    </div>

    <!-- CHAT -->
    <div id="chatPane" class="flex-1 flex flex-col min-w-0 min-h-0">

        <!-- HEADER -->
        <div
            id="chatHeader"
            class="shrink-0 px-3 py-3 md:px-4 font-semibold
            bg-white dark:bg-slate-800
            border-b border-gray-200 dark:border-slate-700"
        >
            Selecciona una conversacion
        </div>

        <!-- MENSAJES -->
        <div
            id="messagesContainer"
            class="flex-1 min-h-0 overflow-y-auto
            bg-gray-100 dark:bg-slate-900 relative"
        >
            <div id="messagesSpacer"></div>

            <div
                id="messages"
                class="absolute top-0 left-0 w-full p-4 flex flex-col gap-3"
            ></div>
        </div>

        <!-- INPUT -->
        <div
            id="chatComposer"
            class="relative shrink-0 p-2 md:p-3 flex flex-col gap-2
            bg-gray-50 dark:bg-slate-800
            border-t border-gray-200 dark:border-slate-700"
        >

            <div id="filePreview" class="hidden flex justify-end"></div>

            <div class="flex gap-2 items-end">
                <!-- FILE -->
                <label
                    id="attachFileBtn"
                    class="h-[42px] w-[42px] flex items-center justify-center
                    rounded-lg hover:bg-gray-200 dark:hover:bg-slate-700
                    transition shrink-0 cursor-pointer"
                    title="Adjuntar archivo"
                    aria-label="Adjuntar archivo"
                >
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                    <input id="fileInput" type="file" multiple class="hidden" />
                </label>

                <!-- EMOJI -->
                <button id="emojiBtn"
                    class="h-[42px] w-[42px] flex items-center justify-center
                        rounded-lg hover:bg-gray-200 dark:hover:bg-slate-700
                        transition shrink-0"
                    title="Emoji"
                    aria-label="Emoji">
                    <i data-lucide="smile" class="w-5 h-5"></i>
                </button>

                <!-- TEXTAREA -->
                <textarea
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    class="flex-1 min-w-0 px-3 py-2 border rounded-lg text-sm outline-none resize-none max-h-[120px] overflow-y-auto
                        bg-white dark:bg-slate-800 border-gray-300 dark:border-slate-600 text-black dark:text-white"
                    oninput="handleTyping(); autoResize(this)"
                ></textarea>

                <!-- ENVIAR -->
                <button id="sendMessageBtn" onclick="send()"
                    class="h-[42px] w-[42px] md:w-auto md:px-4 py-2 inline-flex items-center justify-center bg-green-500 hover:bg-green-600 text-white rounded-lg shrink-0"
                    title="Enviar"
                    aria-label="Enviar">
                    <i data-lucide="send-horizontal" class="w-5 h-5 md:hidden"></i>
                    <span class="hidden md:inline">Enviar</span>
                </button>

                <!-- EMOJI PICKER -->
                <div id="emojiPickerContainer"
                    class="hidden absolute bottom-[60px] left-2 w-[260px] h-[340px]
                        bg-white dark:bg-slate-800
                        border border-gray-200 dark:border-slate-700
                        rounded-xl shadow-lg
                        flex flex-col p-2 z-30">

                    <input id="emojiSearch"
                        placeholder="Buscar emoji..."
                        class="h-8 mb-2 px-2 rounded border
                            border-gray-300 dark:border-slate-600
                            bg-white dark:bg-slate-900
                            text-black dark:text-white
                            text-sm outline-none focus:border-green-500">

                    <div id="emojiGrid"
                        class="flex-1 grid grid-cols-8 gap-1 overflow-y-auto">
                    </div>
                </div>
            </div>

            <div id="composerHint" class="text-xs text-gray-500 mt-1" aria-live="polite"></div>
        </div>
    </div>
</div>

<div
    id="assignManagerModal"
    class="hidden fixed inset-0 z-[60] bg-slate-950/60 p-4 md:p-6"
    aria-hidden="true"
>
    <div class="mx-auto flex h-full max-w-2xl items-center justify-center">
        <div class="w-full max-h-[85vh] overflow-hidden rounded-lg bg-white shadow-2xl dark:bg-slate-900">
            <div class="flex items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-700">
                <div class="min-w-0">
                    <div class="text-sm font-semibold text-slate-900 dark:text-slate-100">Asignar gestor</div>
                    <div id="assignManagerTitle" class="truncate text-xs text-slate-500 dark:text-slate-400"></div>
                </div>
                <button
                    id="assignManagerClose"
                    type="button"
                    class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-slate-100 dark:hover:bg-slate-800"
                    aria-label="Cerrar asignacion"
                    title="Cerrar"
                >
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-700">
                <input
                    id="assignManagerSearch"
                    type="text"
                    placeholder="Buscar por nombre, usuario o jefe"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-white"
                />
            </div>
            <div class="min-h-[280px] max-h-[60vh] overflow-y-auto px-4 py-3">
                <div id="assignManagerLoading" class="hidden py-10 text-center text-sm text-slate-500 dark:text-slate-400">
                    Cargando gestores...
                </div>
                <div id="assignManagerEmpty" class="hidden py-10 text-center text-sm text-slate-500 dark:text-slate-400">
                    No hay gestores activos disponibles.
                </div>
                <div id="assignManagerList" class="flex flex-col gap-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- IMAGE VIEWER GLOBAL -->
<div
  id="imageViewer"
  class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center"
>
    <button
        onclick="closeImageViewer()"
        class="absolute top-4 right-4 text-white"
        title="Cerrar"
        aria-label="Cerrar"
    >
        <i data-lucide="x" class="w-7 h-7"></i>
    </button>

    <div class="w-[90vw] h-[80vh] flex items-center justify-center">
        <img
            id="imageViewerImg"
            class="max-w-full max-h-full object-contain transition-opacity duration-200"
        />
    </div>

    <button onclick="prevImage()" class="absolute left-4 text-white text-3xl" aria-label="Imagen anterior">&lt;</button>
    <button onclick="nextImage()" class="absolute right-4 text-white text-3xl" aria-label="Imagen siguiente">&gt;</button>

    <div
        id="imageThumbs"
        class="flex gap-2 overflow-x-auto max-w-full"
        style="
            scrollbar-width: none;
            -ms-overflow-style: none;
        "
    >
    </div>
</div>
