<div class="flex h-full w-full overflow-hidden">

    <!-- SIDEBAR -->
    <div class="w-80 shrink-0 flex flex-col
        bg-white dark:bg-slate-800
        border-r border-gray-200 dark:border-slate-700"
    >

        <!-- 🔍 BUSCADOR -->
        <div class="p-3">
            <input
                id="searchInput"
                placeholder="Buscar chat..."
                class="w-full px-3 py-2 rounded-lg 
                       bg-gray-100 dark:bg-slate-700
                       text-black dark:text-white
                       text-sm outline-none
                       placeholder-gray-400"
            />
        </div>

        <!-- 🔘 FILTROS -->
        <div class="px-3 pb-2 flex gap-2">

            <button id="filterAll"
                class="filter-btn px-3 py-1 text-xs rounded-lg transition
                    bg-green-600 text-white
                    dark:bg-green-500 dark:text-white">
                Todos
            </button>

            <button id="filterUnread"
                class="filter-btn px-3 py-1 text-xs rounded-lg transition
                    bg-gray-200 text-gray-700
                    dark:bg-slate-700 dark:text-gray-300">
                No leídos
            </button>

        </div>

        <!-- 📋 LISTA -->
        <div
            id="conversationList"
            class="flex-1 overflow-y-auto"
        ></div>
    </div>
    
    <!-- CHAT -->
    <div class="flex-1 flex flex-col min-w-0 min-h-0">

        <!-- HEADER -->
        <div
            id="chatHeader"
            class="shrink-0 px-4 py-3 font-semibold
            bg-white dark:bg-slate-800
            border-b border-gray-200 dark:border-slate-700"
        >
            Selecciona una conversación
        </div>

        <!-- MENSAJES -->
        <div
            id="messagesContainer"
            class="flex-1 min-h-0 overflow-y-auto
            bg-gray-100 dark:bg-slate-900 relative"
        >
            <div id="messagesSpacer"></div>

            <div
                id="messages"
                class="absolute top-0 left-0 w-full p-4 flex flex-col gap-3"
            ></div>
        </div>

        <!-- INPUT -->
        <div
            class="relative shrink-0 p-3 flex flex-col gap-2
            bg-gray-50 dark:bg-slate-800
            border-t border-gray-200 dark:border-slate-700"
        >

            <div id="filePreview" class="hidden flex justify-end"></div>

            <div class="flex gap-2 items-end">
                <!-- 📎 FILE -->
                <label
                    class="h-[42px] w-[42px] flex items-center justify-center 
                    rounded-lg hover:bg-gray-200 dark:hover:bg-slate-700 
                    transition text-xl shrink-0 cursor-pointer"
                >
                    📎
                    <input id="fileInput" type="file" multiple class="hidden" />
                </label>
            
                <!-- 😊 EMOJI -->
                <button id="emojiBtn"
                    class="h-[42px] w-[42px] flex items-center justify-center 
                        rounded-lg hover:bg-gray-200 dark:hover:bg-slate-700 
                        transition text-xl shrink-0">
                    😊
                </button>

                <!-- TEXTAREA -->
                <textarea 
                    id="messageInput"
                    placeholder="Escribe un mensaje..."
                    class="flex-1 px-3 py-2 border rounded-lg text-sm outline-none resize-none max-h-[120px] overflow-y-auto
                        bg-white dark:bg-slate-800 border-gray-300 dark:border-slate-600 text-black dark:text-white"
                    oninput="handleTyping(); autoResize(this)"
                ></textarea>

                <!-- ENVIAR -->
                <button onclick="send()"
                    class="h-[42px] px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg shrink-0">
                    Enviar
                </button>

                <!-- EMOJI PICKER -->
                <div id="emojiPickerContainer"
                    class="hidden absolute bottom-[60px] left-2 w-[260px] h-[340px]
                        bg-white dark:bg-slate-800
                        border border-gray-200 dark:border-slate-700
                        rounded-xl shadow-lg
                        flex flex-col p-2 z-30">

                    <input id="emojiSearch"
                        placeholder="Buscar emoji..."
                        class="h-8 mb-2 px-2 rounded border 
                            border-gray-300 dark:border-slate-600
                            bg-white dark:bg-slate-900
                            text-black dark:text-white
                            text-sm outline-none focus:border-green-500">

                    <div id="emojiGrid"
                        class="flex-1 grid grid-cols-8 gap-1 overflow-y-auto">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- 🖼️ IMAGE VIEWER GLOBAL -->
<div
  id="imageViewer"
  class="hidden fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center"
>
    <button
        onclick="closeImageViewer()"
        class="absolute top-4 right-4 text-white text-2xl"
    >
        ✕
    </button>

    <div class="w-[90vw] h-[80vh] flex items-center justify-center">
        <img
            id="imageViewerImg"
            class="max-w-full max-h-full object-contain transition-opacity duration-200"
        />
    </div>
    <!-- flechas -->
    <button onclick="prevImage()" class="absolute left-4 text-white text-3xl">‹</button>
    <button onclick="nextImage()" class="absolute right-4 text-white text-3xl">›</button>

    <!-- miniaturas -->
    <div
        id="imageThumbs"
        class="flex gap-2 overflow-x-auto max-w-full"
        style="
            scrollbar-width: none;
            -ms-overflow-style: none;
        "
    >
</div>
</div>
