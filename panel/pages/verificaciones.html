<section class="page">
    <div class="page-header">
        <div>
            <h1>Verificaciones</h1>
            <p class="page-description">
                Estado operativo de las verificaciones registradas en el sistema.
            </p>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">Total</span>
            <strong id="kpiTotal">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-label">En proceso</span>
            <strong id="kpiInProgress">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-label">Con inconsistencias</span>
            <strong id="kpiInconsistent">0</strong>
        </div>

        <div class="stat-card">
            <span class="stat-label">Finalizadas</span>
            <strong id="kpiCompleted">0</strong>
        </div>
    </div>

    <div class="panel-card">
        <div class="toolbar">
            <div class="filter-group">
                <button class="filter-btn active" data-status="">Todas</button>
                <button class="filter-btn" data-status="in_progress">En proceso</button>
                <button class="filter-btn" data-status="inconsistent">Inconsistencias</button>
                <button class="filter-btn" data-status="human_required">Asesor</button>
                <button class="filter-btn" data-status="stalled">Inactivas</button>
                <button class="filter-btn" data-status="completed">Finalizadas</button>
            </div>
        </div>

        <div id="verificationLoading" class="table-state hidden">Cargando verificaciones...</div>
        <div id="verificationError" class="table-state error hidden"></div>
        <div id="verificationEmpty" class="table-state hidden">No hay registros para mostrar.</div>

        <div class="table-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>No. cuenta</th>
                        <th>Folio</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Progreso</th>
                        <th>Paso actual</th>
                        <th>Errores</th>
                        <th>Última actividad</th>
                    </tr>
                </thead>
                <tbody id="verificationTableBody"></tbody>
            </table>
        </div>
    </div>
</section>
