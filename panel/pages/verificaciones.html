<section class="flex flex-col gap-4 md:gap-6 text-gray-900 dark:text-white">

    <div>
        <h1 class="text-xl font-semibold md:text-2xl">Verificaciones</h1>
        <p class="text-sm text-gray-500 dark:text-slate-400">
            Estado operativo de las verificaciones registradas en el sistema.
        </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3 md:gap-4">
        <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-5">
            <span class="text-sm text-gray-500 dark:text-slate-400">Total</span>
            <div id="kpiTotal" class="mt-2 text-2xl font-semibold">0</div>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-5">
            <span class="text-sm text-gray-500 dark:text-slate-400">En proceso</span>
            <div id="kpiInProgress" class="mt-2 text-2xl font-semibold">0</div>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-5">
            <span class="text-sm text-gray-500 dark:text-slate-400">Requiere atención</span>
            <div id="kpiInconsistent" class="mt-2 text-2xl font-semibold">0</div>
        </div>

        <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-5">
            <span class="text-sm text-gray-500 dark:text-slate-400">Finalizadas</span>
            <div id="kpiCompleted" class="mt-2 text-2xl font-semibold">0</div>
        </div>
    </div>

    <div
        class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-4 md:p-5 flex flex-col gap-4">
        <div
            class="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1 md:mx-0 md:flex-wrap md:overflow-visible md:px-0 md:pb-0">
            <button class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-blue-500 text-white transition"
                data-status="">Todas</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="in_progress">En proceso</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="inconsistent">Inconsistencias</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="doubts">Dudas</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="stalled">Inactivas</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="calls">Llamadas</button>
            <button
                class="filter-btn shrink-0 px-3 py-2 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition"
                data-status="completed">Finalizadas</button>
        </div>

        <div id="verificationLoading" class="hidden text-gray-500 dark:text-slate-400">Cargando verificaciones...</div>
        <div id="verificationError" class="hidden text-red-500"></div>
        <div id="verificationEmpty" class="hidden text-gray-500 dark:text-slate-400">No hay registros para mostrar.
        </div>

        <div id="verificationTableWrapper" class="overflow-x-auto">
            <table class="w-full min-w-[980px] text-sm">
                <thead>
                    <tr class="border-b border-gray-200 dark:border-slate-700 text-gray-500 dark:text-slate-400">
                        <th class="px-4 py-3 text-left font-medium">No. cuenta</th>
                        <th class="px-4 py-3 text-left font-medium">Folio</th>
                        <th class="px-4 py-3 text-left font-medium">Teléfono</th>
                        <th class="px-4 py-3 text-left font-medium">Estado</th>
                        <th class="px-4 py-3 text-left font-medium">Progreso</th>
                        <th class="px-4 py-3 text-left font-medium">Pregunta actual</th>
                        <th class="px-4 py-3 text-left font-medium">Observaciones</th>
                        <th class="px-4 py-3 text-left font-medium">Última actividad</th>
                    </tr>
                </thead>

                <tbody id="verificationTableBody"></tbody>
            </table>
        </div>
    </div>

</section>
