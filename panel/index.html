<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>MXCOMP Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#3b82f6",
            panel: "#1e293b",
            panelBorder: "#334155",
            textMuted: "#94a3b8"
          }
        }
      }
    };
    </script>
</head>

<body class="h-screen overflow-hidden bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-white">
    
    <div id="app" class="h-full flex flex-col">
        <header id="header"></header>

        <div class="flex flex-1 overflow-hidden">
            <aside id="sidebar"></aside>
            <main id="content" class="flex-1 overflow-y-auto min-w-0 min-h-0 p-6 bg-gray-100 dark:bg-slate-900 transition-colors duration-300"></main>

        </div>

        
        <div id="drawer"
            class="fixed top-0 right-0 z-50 h-full w-[420px] max-w-full translate-x-full bg-gray-50 dark:bg-slate-900 border-l border-gray-200 dark:border-slate-700 shadow-xl transition-transform duration-300 ease-out">
            <div id="drawerBody" class="h-full overflow-y-auto p-4 md:p-5"></div>
        </div>

        <div id="drawerOverlay"
            class="pointer-events-none fixed inset-0 z-40 bg-black/40 opacity-0 transition-transform duration-300 ease-out">
        </div>
    </div>

    <script src="/js/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
